[package]
name = "mhfz-sigil-sniper"
version = "0.2.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui_extras = { version = "0.37.0", features = ["image"] }
image = { version = "0.25.10", features = ["png"], default-features = false }
postcard = { version = "1.1.3", features = ["use-std"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jiff = "0.2.43"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
jiff = { version = "0.2.43", features = ["js"] }
