[package]
name = "mhfz-sigil-sniper"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
eframe = { version = "0.34.1", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui_extras = { version = "0.34.1", features = ["image"] }
image = { version = "0.25.10", features = ["png"], default-features = false }
jiff = "0.2.23"
postcard = { version = "1.1.3", features = ["use-std"] }
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
